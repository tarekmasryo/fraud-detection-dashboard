[build-system]
requires = ["setuptools>=78.1.1", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[project]
name = "fraud-risk-ops-platform"
version = "0.1.0"
description = "Production-structured fraud risk operations platform with FastAPI scoring, policy governance, audit logging, worker-backed batch jobs, monitoring, and Docker."
requires-python = ">=3.11,<3.12"
readme = "README.md"
license = {text = "MIT"}

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["artifacts", "data"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
