services:
  api:
    build:
      context: .
      target: api
    image: fraud-dashboard-api:local
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped

  ui:
    build:
      context: .
      target: ui
    image: fraud-dashboard-ui:local
    ports:
      - "8501:8501"
    environment:
      - PYTHONUNBUFFERED=1
      - FRAUD_API_URL=http://api:8000
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
      - STREAMLIT_SERVER_PORT=8501
    depends_on:
      - api
    restart: unless-stopped
